name: tojtech

services:
  # ---------- PostgreSQL ----------
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-shodruz}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-myshop}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Optional: lets DataGrip/psql on your machine connect. 5433 so it doesn't
      # collide with a Postgres you already run locally on 5432.
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"

  # ---------- one-shot: apply SQL migrations, then exit ----------
  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER:-shodruz}:${DB_PASSWORD}@db:5432/${DB_NAME:-myshop}?sslmode=disable"
      - "up"
    restart: "no"

  # ---------- Go API ----------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DB_USER: ${DB_USER:-shodruz}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-myshop}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/categories || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    ports:
      # The frontend (npm run dev) and the .http files call http://localhost:8080.
      - "127.0.0.1:${API_PORT:-8080}:8080"

volumes:
  pgdata: